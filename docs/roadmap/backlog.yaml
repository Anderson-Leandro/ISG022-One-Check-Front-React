- id: US-001
  type: story
  title: Entrar com e-mail, senha e MFA e manter a sessão
  epic: EP-002
  story: Como usuário da OneCheck, quero entrar com e-mail, senha e código do autenticador, para acessar o sistema
    com a sessão protegida.
  description: Entrega reconstruída do histórico na adoção do roadmap (2026-11-13).
  acceptance_criteria:
  - Dado credenciais válidas e MFA exigido, quando informo o código, então entro na página inicial do meu perfil.
  - Dado um login ou código recusado, quando a API responde 401, então a tela mostra o erro e não renova a sessão
    nem repete o envio.
  - Dado a senha fora da política, quando entro, então sou levado à troca obrigatória de senha.
  - Dado o refresh recusado, quando qualquer rota responde 401, então a sessão é encerrada com aviso na tela de
    login.
  priority: must
  rank: 130
  estimate: 8
  status: done
  sprint: null
  phase: F3
